# Límites de peticiones por IP: protegen la API y, con más rigor, el inicio de sesión
limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

# El DNS interno de Docker devuelve todas las réplicas de "gateway"; "resolve" las actualiza cada 5 s
resolver 127.0.0.11 valid=5s ipv6=off;
upstream gateway {
    zone gateway 64k;
    server gateway:3000 resolve max_fails=1 fail_timeout=10s;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/nginx/tls/movia.crt;
    ssl_certificate_key /etc/nginx/tls/movia.key;
    ssl_protocols       TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ws: wss:; style-src 'self' 'unsafe-inline'" always;
    server_tokens off;
    client_max_body_size 16k;

    root /usr/share/nginx/html;
    location / {
        try_files $uri /index.html;
    }

    # Si una réplica del gateway falla, Nginx reintenta la petición en la otra
    location /api/ {
        limit_req zone=api burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://gateway;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/auth/login {
        limit_req zone=login burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://gateway;
        proxy_next_upstream error timeout http_502;
    }

    location /socket.io/ {
        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }
}
